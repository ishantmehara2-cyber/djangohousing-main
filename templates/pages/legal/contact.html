{% extends 'base.html' %}
{% block title %}Contact Support | Housing..{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12 space-y-8">
    <div class="border-b border-gray-200 pb-6">
        <h1 class="text-3xl font-black text-gray-900">Contact Us</h1>
        <p class="text-sm text-gray-500 mt-2">We are here to assist you with your real estate journey.</p>
    </div>

    <form method="POST" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Your Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary">
            </div>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Message / Enquiry</label>
            <textarea name="message" rows="5" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary"></textarea>
        </div>
        <button type="submit" class="w-full bg-brand-primary hover:bg-brand-hover text-white font-bold py-3.5 rounded-xl transition text-sm">Send Message</button>
    </form>
</div>
{% endblock %}
