{% extends 'base.html' %}
{% block title %}Create Support Ticket | Housing..{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12 space-y-8">
    <div class="border-b border-gray-200 pb-6">
        <h1 class="text-2xl font-black text-gray-900">Submit Support Request</h1>
        <p class="text-xs text-gray-500 mt-1">Provide details of your issue and our support team will assist you.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Category</label>
                <select name="category" class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary">
                    {% for code, label in categories %}
                    <option value="{{ code }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Priority</label>
                <select name="priority" class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary">
                    {% for code, label in priorities %}
                    <option value="{{ code }}" {% if code == 'MEDIUM' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Subject</label>
            <input type="text" name="subject" required placeholder="Brief summary of the issue..." class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Description</label>
            <textarea name="description" rows="5" required placeholder="Detailed explanation..." class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-primary"></textarea>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Attachment (Optional)</label>
            <input type="file" name="attachment" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
        </div>

        <button type="submit" class="w-full bg-brand-primary hover:bg-brand-hover text-white font-bold py-3.5 rounded-xl transition text-sm">Submit Ticket</button>
    </form>
</div>
{% endblock %}
