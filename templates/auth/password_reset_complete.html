{% extends 'base.html' %}

{% block title %}Password Reset Complete | Housing..{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-sm space-y-6">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black">
            ✓
        </div>
        <div class="space-y-2">
            <h1 class="text-xl font-black text-gray-900">Password Reset Successful</h1>
            <p class="text-xs text-gray-500 font-medium">Your password has been reset successfully. You may now log in with your new password.</p>
        </div>
        <a href="{% url 'accounts:login' %}" class="inline-block bg-brand-primary text-white px-6 py-3 rounded-xl font-bold text-xs shadow-sm">
            Log In Now
        </a>
    </div>
</div>
{% endblock %}
